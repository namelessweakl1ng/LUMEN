[project]
name = "lumen-backend"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "defusedxml>=0.7.1,<1"]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
