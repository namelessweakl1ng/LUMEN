# SearXNG settings for Lumen.
#
# This file is copied into the persistent volume at
# docker/searxng-data/settings.yml before first start. Edit that copy
# to customize your instance.
#
# Docs: https://docs.searxng.org/admin/settings/settings.html

# Inherit all default engines and settings from SearXNG, then override
# only what we need below.
use_default_settings: true

general:
  debug: false
  instance_name: "Lumen SearXNG"

search:
  # 0: off, 1: moderate, 2: strict. Users can override per-request.
  safe_search: 1
  # Disable autocomplete — Lumen has its own search box.
  autocomplete: ""
  default_lang: "auto"
  # CRITICAL: Lumen calls /search?format=json. Without "json" in this
  # list, SearXNG returns HTML and the API returns a malformed error.
  formats:
    - html
    - json

server:
  # Bind inside the container; Docker maps it to the host.
  bind_address: "0.0.0.0"
  port: 8080
  # MUST be replaced before going live. The setup script in
  # docker/README.md does this automatically.
  secret_key: "REPLACE_WITH_A_LONG_RANDOM_STRING"
  # Disable SearXNG's built-in rate limiter (requires Redis/Valkey).
  # Lumen has its own in-memory limiter.
  limiter: false
  # Proxy image results through SearXNG so the browser doesn't contact
  # external image hosts directly.
  image_proxy: true

# No engines: section needed — use_default_settings: true loads all
# default engines. To disable a specific engine, add an engines:
# section with the engine name and disabled: true. For example:
#
# engines:
#   - name: google
#     disabled: true
